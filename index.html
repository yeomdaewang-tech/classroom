  openDialog({title:'인쇄하기',sub:'A4 가로 한 장에 맞춰 인쇄해요.',
    body:[
      h('label',{class:'pin-switch',for:'pAtt'},att,h('span',null,h('b',{text:'책상에 출결 표시'}),h('small',{class:'muted',style:'display:block',text:'결석·지각·조퇴·결과 색과 사유를 함께 인쇄해요.'}))),
      h('label',{class:'pin-switch',for:'pSideChk'},side,h('span',null,h('b',{text:'오른쪽에 인원 현황과 교시별 기록표'}),h('small',{class:'muted',style:'display:block',text:`총원 ${hc.total} · 결원 ${hc.absent.length} · 현재원 ${hc.present} (${stampLabel()}), 아래에 과목과 출결 특이사항을 손으로 적는 빈 표`}))),
      h('label',{class:'inline-nums',for:'pPer'},h('span',{style:'font-size:13.5px',text:'기록표 교시'}),per),
      h('p',{style:'margin:0',class:'muted',text:'결원은 그날 결석·지각·조퇴·결과로 적은 학생 수예요 (색칠된 책상 수와 같아요). 인쇄한 뒤 바뀌면 숫자 아래 빈칸에 시각과 함께 적으세요. 교실에 붙일 때는 ‘보기: 학생 시점’으로 바꾼 뒤 인쇄하면 학생들이 보는 방향과 같아져요.'})],
    actions:[{label:'취소'},{label:'인쇄하기',kind:'primary',submit:true}],
    onSubmit:()=>{S.settings.print={att:att.checked,side:side.checked,periods:parseInt(per.value)||7};save();setTimeout(doPrint,80);}});
}

/* ---------- wiring ---------- */
function bind(){
  document.addEventListener('pointerdown',onDown);
  $('#board').addEventListener('dblclick',e=>{if(mode!=='edit')return;const fx=e.target.closest('.fixture');if(fx){renameFixture(fx.dataset.id);return;}if(e.target.closest('.desk'))return;const [bx,by]=clientToBoard(e.clientX,e.clientY);addDesk(Math.max(0,snap(bx-DW/2)),Math.max(0,snap(by-DH/2)));});
  document.addEventListener('keydown',e=>{
    const ae=document.activeElement;const typing=ae&&(/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)||ae.isContentEditable);
    if(dlg.open)return;
    const mod=e.ctrlKey||e.metaKey;const k=e.key.toLowerCase();
    if(mod&&!typing&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
    if(mod&&!typing&&k==='y'){e.preventDefault();redo();return;}
    if(typing)return;
    if(view!=='board')return;
    if(mode==='seat'&&(e.key==='Enter'||e.key===' ')){const chip=ae&&ae.closest&&ae.closest('.chip,[data-id]');if(chip){e.preventDefault();if(chip.dataset.sid)openAttendance(chip.dataset.sid);else{const d=deskById(chip.dataset.id);if(d)d.sid?openAttendance(d.sid):openSeatPicker(d.id);}}return;}
    if(mode!=='edit')return;
    if(e.key==='Delete'||e.key==='Backspace'){if(selected.size){e.preventDefault();deleteSelected();}}
    else if(e.key.startsWith('Arrow')&&selected.size){e.preventDefault();const st=e.shiftKey?40:8;nudge(e.key==='ArrowLeft'?-st:e.key==='ArrowRight'?st:0,e.key==='ArrowUp'?-st:e.key==='ArrowDown'?st:0);}
    else if(mod&&k==='a'){e.preventDefault();C().desks.forEach(d=>selected.add(d.id));C().fixtures.forEach(f=>selected.add(f.id));renderBoard();renderToolbar();}
    else if(mod&&k==='d'){e.preventDefault();duplicateSelected();}
    else if(e.key==='Escape'){selected.clear();renderBoard();renderToolbar();}
  });
  $('#bellBtn').addEventListener('click',()=>openAlarms(null));
  $('#tabBoard').addEventListener('click',()=>setView('board'));
  $('#tabReg').addEventListener('click',()=>setView('reg'));
  $$('#regPresets button').forEach(b=>b.addEventListener('click',()=>{const R=S.settings.reg;R.preset=b.dataset.p;R.from='';R.to='';save();renderReg();}));
  const onRange=()=>{const R=S.settings.reg;const a=$('#regFrom').value,b=$('#regTo').value;if(!a||!b)return;R.preset='custom';R.from=a;R.to=b;save();renderReg();};
  $('#regFrom').addEventListener('change',onRange);$('#regTo').addEventListener('change',onRange);
  $$('#regTabs button').forEach(b=>b.addEventListener('click',()=>{S.settings.reg.tab=b.dataset.t;save();renderReg();}));
  $('#regTodo').addEventListener('change',e=>{S.settings.reg.todo=e.target.checked;save();renderReg();});
  $('#regDocTodo').addEventListener('change',e=>{S.settings.reg.docTodo=e.target.checked;save();renderReg();});
  $('#regAdd').addEventListener('click',()=>openBatch());
  $('#regNeis').addEventListener('click',()=>{const i=$('#neisFile');i.value='';i.click();});
  $('#regNeisLog').addEventListener('click',()=>openNeisLog());
  $('#rulesBtn').addEventListener('click',()=>openRules());
  $('#neisFile').addEventListener('change',e=>{const fs=Array.from(e.target.files||[]);if(fs.length)importNeisFiles(fs);});
  $('#regExport').addEventListener('click',()=>exportRegXlsx());
  $('#regPrint').addEventListener('click',printRegGrid);
  $('#regUndo').addEventListener('click',undo);
  $('#modeSeat').addEventListener('click',()=>setMode('seat'));
  $('#modeEdit').addEventListener('click',()=>setMode('edit'));
  $('#randomBtn').addEventListener('click',openRandom);
  $('#clearSeatsBtn').addEventListener('click',clearSeats);
  $('#addDeskBtn').addEventListener('click',()=>addDesk());
  $('#addFixtureBtn').addEventListener('click',openAddFixture);
  $('#dupBtn').addEventListener('click',duplicateSelected);
  $('#delBtn').addEventListener('click',deleteSelected);
  $('#presetBtn').addEventListener('click',openPreset);
  $('#renameFxBtn').addEventListener('click',()=>{const id=[...selected][0];if(id)renameFixture(id);});
  $('#undoBtn').addEventListener('click',undo);$('#redoBtn').addEventListener('click',redo);
  $('#viewBtn').addEventListener('click',()=>{const c=C();pushUndo();c.view=c.view==='student'?'teacher':'student';commit();toast(c.view==='student'?'학생 시점: 교탁이 위로 가요':'교사 시점: 교탁이 아래로 가요');});
  const menu=$('#moreMenu'),more=$('#moreBtn');
  more.addEventListener('click',e=>{e.stopPropagation();menu.hidden=!menu.hidden;more.setAttribute('aria-expanded',String(!menu.hidden));});
  document.addEventListener('click',e=>{if(!menu.hidden&&!e.target.closest('.menu-wrap')){menu.hidden=true;more.setAttribute('aria-expanded','false');}});
  menu.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;menu.hidden=true;more.setAttribute('aria-expanded','false');
    const a=b.dataset.act;
    if(a==='export')exportXlsx();else if(a==='print')openPrint();else if(a==='roster')openRosterEditor();else if(a==='colors')openColors();else if(a==='backup')backup();else if(a==='autobackup')openBackup();else if(a==='alarms')openAlarmSettings();else if(a==='rules')openRules();
    else if(a==='restore')openRestore();else if(a==='openfolder')openRestore({folder:true});else if(a==='newfile')openNewFile();});
  if(BUILD!=='file'){$$('.file-only').forEach(x=>x.hidden=true);$('#menuNote').textContent='인쇄는 엑셀로 내보낸 뒤 엑셀에서 하세요. 배치도 시트에 인원 현황과 교시별 기록표가 함께 들어가요.';}
  else $('#menuNote').hidden=true;
  $('#importBtn').addEventListener('click',()=>openImport());
  $('#bannerImport').addEventListener('click',()=>openImport());
  $('#rosterEditBtn').addEventListener('click',openRosterEditor);
  $('#classManageBtn').addEventListener('click',openClassManager);
  $('#bannerClear').addEventListener('click',()=>{const c=C();pushUndo();c.students=[];c.attendance={};c.desks.forEach(d=>d.sid=null);c.sample=false;commit();toast('예시를 지웠어요. 이제 명단을 불러오세요');});
  $('#classSelect').addEventListener('change',e=>switchClass(e.target.value));
  const ti=$('#classTitle');
  ti.addEventListener('input',()=>{C().name=ti.value;sizeTitle();const o=$('#classSelect').selectedOptions[0];if(o)o.textContent=ti.value||'이름 없는 반';$('#printTitle').textContent=ti.value;save();});
  ti.addEventListener('blur',()=>{if(!ti.value.trim()){C().name='이름 없는 반';}else C().name=ti.value.trim();commit();});
  ti.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ti.blur();}});
  const setDate=d=>{if(!d||d===curDate)return;if(mode==='edit')setMode('seat');curDate=d;selected.clear();renderAll();};
  $('#dateInput').addEventListener('change',e=>setDate(e.target.value));
  $('#datePrev').addEventListener('click',()=>setDate(stepSchoolDay(curDate,-1)));
  $('#dateNext').addEventListener('click',()=>setDate(stepSchoolDay(curDate,1)));
  $('#dateToday').addEventListener('click',()=>setDate(todayStr()));
  window.addEventListener('dragover',e=>{if(e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files'))e.preventDefault();});
  window.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;e.preventDefault();if(dlg.open)return;if(/\.json$/i.test(f.name))restoreFromFile(f);else if(view==='reg')importNeisFiles(Array.from(e.dataTransfer.files));else openImport(f);});
  let rt=null;const onResize=()=>{clearTimeout(rt);rt=setTimeout(()=>{sizeTitle();if(!ptr)renderBoard();},80);};
  window.addEventListener('resize',onResize);
  if(window.ResizeObserver)new ResizeObserver(onResize).observe($('#boardWrap'));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){setTimeout(maybeStartAlarms,300);}if(document.visibilityState==='hidden'){if(saveTimer)saveNow();if(snapTimer){clearTimeout(snapTimer);snapshotNow();}if(fileTimer){clearTimeout(fileTimer);writeFolderBackup(false);}}});
  window.addEventListener('pagehide',()=>{if(saveTimer)saveNow();if(snapTimer){clearTimeout(snapTimer);snapshotNow();}if(fileTimer){clearTimeout(fileTimer);writeFolderBackup(false);}});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{sizeTitle();});
}

S=loadState();
if(!S){S=freshState();try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){storageOk=false;}}
if(FILE_LABEL){const t=$('#fileTag');t.hidden=false;t.textContent=`파일: ${FILE_LABEL}`;t.title='새 파일 만들기로 만든 파일이에요. 기록이 다른 파일과 따로 저장돼요';}
bind();renderAll();
checkOtherTabs().then(dup=>{if(dup)return;startupDone=true;initBackup();setTimeout(maybeStartAlarms,200);});
})();
