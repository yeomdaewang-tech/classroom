<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>교실 자리 배치표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: chalkboard-green header band, then a tool row, then roster panel + scaled classroom board */
:root{
  --bg:#ECEFEC; --surface:#FFFFFF; --surface-2:#F3F6F4; --board:#F8FAF8; --grid:rgba(43,90,74,.18);
  --ink:#1B2420; --muted:#56645E; --faint:#8A9690; --line:#CED6D2; --line-strong:#A3B1AA;
  --chalk:#2B5A4A; --chalk-2:#224A3C; --chalk-ink:#F1F6EF; --chalk-muted:#B7CFC3; --chalk-line:rgba(241,246,239,.28);
  --accent-soft:#DDEAE3; --focus:#2F8466;
  --desk:#FFFFFF; --desk-edge:#C8B38C;
  --fixture:#DCEAD3; --fixture-ink:#2C4826; --fixture-edge:#A9C69C;
  --select:#2F74D0; --select-soft:rgba(47,116,208,.12);
  --danger:#B42A20; --shadow:rgba(16,28,22,.16); --rule:#3E4A45; --sym-red:#D2382B;
  --c-absent:#F4C4BE; --c-absent-ink:#5E2A25; --c-absent-edge:#C9938D;
  --c-late:#F6DF9C; --c-late-ink:#5C4A16; --c-late-edge:#C4A85D;
  --c-early:#D9CDF2; --c-early-ink:#3F3463; --c-early-edge:#A69AC2;
  --c-result:#C7DDF3; --c-result-ink:#26405A; --c-result-edge:#93AAC2;
  --font-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1A2220; --surface-2:#212B28; --board:#161E1B; --grid:rgba(150,200,175,.13);
  --ink:#E3EBE7; --muted:#9DABA5; --faint:#6F7D77; --line:#33413C; --line-strong:#4E5F58;
  --chalk:#1E4136; --chalk-2:#17342B; --chalk-ink:#E8F1EB; --chalk-muted:#9CBBAD; --chalk-line:rgba(232,241,235,.24);
  --accent-soft:#213A31; --focus:#79C2A4;
  --desk:#222C29; --desk-edge:#6E5D40;
  --fixture:#26392C; --fixture-ink:#CDE5C4; --fixture-edge:#3E5A44;
  --select:#6CA9F4; --select-soft:rgba(108,169,244,.16);
  --danger:#F28A80; --shadow:rgba(0,0,0,.45); --rule:#9DABA5; --sym-red:#FF8A7A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1A2220; --surface-2:#212B28; --board:#161E1B; --grid:rgba(150,200,175,.13);
  --ink:#E3EBE7; --muted:#9DABA5; --faint:#6F7D77; --line:#33413C; --line-strong:#4E5F58;
  --chalk:#1E4136; --chalk-2:#17342B; --chalk-ink:#E8F1EB; --chalk-muted:#9CBBAD; --chalk-line:rgba(232,241,235,.24);
  --accent-soft:#213A31; --focus:#79C2A4;
  --desk:#222C29; --desk-edge:#6E5D40;
  --fixture:#26392C; --fixture-ink:#CDE5C4; --fixture-edge:#3E5A44;
  --select:#6CA9F4; --select-soft:rgba(108,169,244,.16);
  --danger:#F28A80; --shadow:rgba(0,0,0,.45); --rule:#9DABA5; --sym-red:#FF8A7A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* header band */
.band{background:var(--chalk);color:var(--chalk-ink)}
.band-in{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:14px 12px;max-width:1500px;margin:0 auto}
.vtabs-in{max-width:1500px;margin:0 auto;display:flex;align-items:flex-end;gap:12px}
.vtabs{display:flex;gap:4px}
.vtabs button{border:0;background:transparent;color:var(--chalk-muted);font-weight:600;font-size:14.5px;padding:8px 16px 9px;border-radius:9px 9px 0 0;cursor:pointer;white-space:nowrap}
.vtabs button:hover{color:var(--chalk-ink);background:var(--chalk-2)}
.vtabs button[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.vtabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;font-size:11.5px;line-height:18px;text-align:center;background:var(--c-late);color:var(--c-late-ink);font-weight:600;font-variant-numeric:tabular-nums}
body[data-view="reg"] .datebar{visibility:hidden}
.title-col{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 320px}
.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--chalk-muted)}
.eyebrow select{background:var(--chalk-2);color:var(--chalk-ink);border:1px solid var(--chalk-line);border-radius:7px;padding:3px 8px;max-width:220px;color-scheme:dark}
.bandbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--chalk-line);background:var(--chalk-2);color:var(--chalk-ink);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.bandbtn:hover{border-color:var(--chalk-ink)}
.bic{display:inline-flex}.bic svg{width:15px;height:15px;display:block}
.filetag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--c-late);color:var(--c-late-ink)}
.linkbtn{background:none;border:0;padding:2px 4px;color:var(--chalk-muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;border-radius:4px}
.linkbtn:hover{color:var(--chalk-ink)}
.class-title{font-family:var(--font-display);font-size:clamp(26px,3.6vw,36px);line-height:1.15;color:var(--chalk-ink);background:transparent;border:0;border-bottom:2px dashed transparent;padding:2px 2px 0;margin-left:-2px;max-width:100%;min-width:4em;letter-spacing:.01em}
.class-title:hover{border-bottom-color:var(--chalk-line)}
.class-title:focus{outline:none;border-bottom-color:var(--chalk-ink)}
.measure{position:fixed;left:-10000px;top:0;visibility:hidden;white-space:pre;font-family:var(--font-display);font-size:clamp(26px,3.6vw,36px);letter-spacing:.01em;padding:0 2px}
.datebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.datebar .dbtn{height:34px;min-width:34px;padding:0 10px;border-radius:8px;border:1px solid var(--chalk-line);background:var(--chalk-2);color:var(--chalk-ink);cursor:pointer;font-weight:500}
.datebar .dbtn:hover{border-color:var(--chalk-ink)}
.datebar input[type=date]{height:34px;border-radius:8px;border:1px solid var(--chalk-line);background:var(--chalk-2);color:var(--chalk-ink);padding:0 8px;color-scheme:dark;font-variant-numeric:tabular-nums}
.dow{font-family:var(--font-display);font-size:20px;min-width:2.2em;text-align:center}

/* tool row */
.toolbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:12px 4px;max-width:1500px;margin:0 auto}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--chalk-ink)}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.spacer{flex:1 1 auto}
.btn{height:34px;padding:0 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--chalk);color:var(--chalk-ink);border-color:var(--chalk)}
.btn.primary:hover{background:var(--chalk-2)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
:is(button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sel-count{font-size:13px;color:var(--muted);padding:0 4px}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:220px;box-shadow:0 12px 32px var(--shadow)}
.menu button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--surface-2)}
.menu .sep{height:1px;background:var(--line);margin:5px 4px}
.menu .note{font-size:12px;color:var(--muted);padding:4px 12px 6px}

.summary-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding-block:6px 0;max-width:1500px;margin:0 auto;min-height:30px}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.stat b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.stat.hc{padding:2px 9px;border-radius:999px;background:var(--surface-2)}
.stat.hc.miss{background:var(--c-absent);color:var(--c-absent-ink)}
.stat.hc.miss b{color:var(--c-absent-ink)}
.stat.hc.now{background:var(--accent-soft)}
.stat.hc.now b{color:var(--ink)}
.stat .sw{width:12px;height:12px;border-radius:3px;background:var(--x);border:1px solid var(--x-edge)}
.stat.zero b{color:var(--faint);font-weight:500}
.savestate{margin-left:auto;font-size:12.5px;color:var(--faint);display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.bk{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.bk:hover{border-color:var(--focus)}
.bk.go{background:var(--chalk);border-color:var(--chalk);color:var(--chalk-ink)}
.bk.go:hover{background:var(--chalk-2)}
.bk.ok{background:var(--accent-soft);border-color:var(--fixture-edge);color:var(--focus)}
.bk.warn{background:var(--c-late);border-color:var(--c-late-edge);color:var(--c-late-ink)}
.bk.bad{border-color:var(--danger);color:var(--danger)}
.bk-ic{width:14px;height:14px;display:block}
.bk-sec{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.bk-sec h3{margin:0;font-size:14.5px;font-weight:600}
.bk-sec p{margin:0;font-size:13px;color:var(--muted);line-height:1.55}
.bk-sec .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bk-state{font-size:13.5px;font-weight:600}
.bk-state.ok{color:var(--focus)}
.bk-state.warn{color:var(--c-late-ink)}
.snap-list{display:flex;flex-direction:column;gap:4px;max-height:210px;overflow:auto}
.snap-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;font-size:13px}
.snap-row:hover{background:var(--surface-2)}
.snap-row .d{flex:1 1 auto;font-variant-numeric:tabular-nums}
.snap-row .d small{color:var(--muted);margin-left:6px}
.savestate.bad{color:var(--danger)}

/* main area */
.work{display:grid;grid-template-columns:232px minmax(0,1fr);gap:16px;padding-block:12px 24px;max-width:1500px;margin:0 auto;align-items:start}
.roster{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.roster.drop{outline:2px dashed var(--focus);outline-offset:2px;background:var(--accent-soft)}
.roster h2{font-size:15px;font-weight:600;margin:0}
.roster .meta{font-size:12.5px;color:var(--muted);margin-top:-6px}
.roster-actions{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:6px 10px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:8px;background:var(--surface);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-weight:600;font-size:14px}
.chip .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.chip:hover{border-color:var(--focus)}
.chip.src{opacity:.35}
.chip.att{background:var(--att-bg);border-color:var(--att-edge);color:var(--att-ink)}
.chip.att .n{color:var(--att-ink)}
.roster .empty-note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.roster .tip{font-size:12px;color:var(--faint);line-height:1.5}

.stage{min-width:0;display:flex;flex-direction:column;gap:10px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--accent-soft);border:1px solid var(--fixture-edge);border-radius:10px;padding:10px 14px;font-size:13.5px}
.banner p{margin:0;flex:1 1 260px}
.board-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;overflow-y:hidden;min-width:0}
.scaler{position:relative;margin:0 auto}
.board{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--board);border-radius:8px}
.board.editing{background-color:var(--board);background-image:radial-gradient(var(--grid) 1.2px, transparent 1.3px);background-size:16px 16px;background-position:-8px -8px}
.hint{font-size:12.5px;color:var(--faint);text-align:center}

/* desks */
.desk{position:absolute;width:104px;height:72px;padding:3px;touch-action:none;user-select:none;-webkit-user-select:none}
.desk-card{width:100%;height:100%;background:var(--desk);border:1px solid var(--line-strong);border-bottom-width:3px;border-bottom-color:var(--desk-edge);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 5px;overflow:hidden;transition:transform .12s ease}
.desk.filled{cursor:grab}
.desk.filled:hover .desk-card{border-color:var(--focus);border-bottom-color:var(--desk-edge)}
.desk-card{position:relative}
.d-pin{position:absolute;top:4px;right:4px;width:17px;height:17px;border-radius:5px;background:var(--chalk);color:var(--chalk-ink);display:flex;align-items:center;justify-content:center}
.d-pin svg,.pin-ic svg{width:10px;height:10px;display:block}
.pick-grid .chip[aria-pressed="true"]{background:var(--chalk);color:var(--chalk-ink);border-color:var(--chalk)}
.pick-grid .chip[aria-pressed="true"] .n{color:var(--chalk-muted)}
.pin-ic{display:none}
.pick-grid .chip[aria-pressed="true"] .pin-ic{display:inline-flex;align-self:center}
.pin-switch{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13.5px}
.pin-switch:has(input:checked){border-color:var(--focus);background:var(--accent-soft)}
.pin-switch input{margin-top:3px}
.d-num{font-size:12px;line-height:1.2;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.d-name{font-weight:600;line-height:1.2;color:var(--ink);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-att{font-size:12.5px;line-height:1.3;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;margin-top:1px}
.desk.empty .desk-card{background:var(--desk);border-color:var(--line);border-bottom-color:var(--desk-edge);cursor:pointer}
.d-empty{font-size:12px;color:var(--faint);font-weight:500}
.d-plus{color:var(--faint);font-size:20px;line-height:1}
.desk.att .desk-card{background:var(--att-bg);border-color:var(--att-edge);border-bottom-color:var(--att-edge)}
.desk.att .d-num,.desk.att .d-name,.desk.att .d-att{color:var(--att-ink)}
.att-absent{--att-bg:var(--c-absent);--att-edge:var(--c-absent-edge);--att-ink:var(--c-absent-ink)}
.att-late{--att-bg:var(--c-late);--att-edge:var(--c-late-edge);--att-ink:var(--c-late-ink)}
.att-early{--att-bg:var(--c-early);--att-edge:var(--c-early-edge);--att-ink:var(--c-early-ink)}
.att-result{--att-bg:var(--c-result);--att-edge:var(--c-result-edge);--att-ink:var(--c-result-ink)}
.desk.src .desk-card{opacity:.3}
.desk.drop .desk-card{outline:3px solid var(--focus);outline-offset:1px;transform:scale(1.04)}
.editing .desk,.editing .fixture{cursor:move}
.editing .desk.empty .desk-card{cursor:move}
.desk.sel .desk-card,.fixture.sel{outline:2px solid var(--select);outline-offset:2px;box-shadow:0 0 0 6px var(--select-soft)}
.fixture{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:600;font-size:15px;touch-action:none;user-select:none;-webkit-user-select:none;text-align:center;padding:0 6px;overflow:hidden}
.fixture span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fixture.t-teacher{background:var(--chalk);color:var(--chalk-ink);font-family:var(--font-display);font-weight:400;font-size:19px;letter-spacing:.06em}
.fixture.t-door,.fixture.t-other{background:var(--fixture);color:var(--fixture-ink);border:1px solid var(--fixture-edge)}
.fixture.t-window{background:var(--surface-2);color:var(--muted);border:1px solid var(--line-strong);font-size:12px;font-weight:500}
.fx-resize{position:absolute;right:0;bottom:0;width:14px;height:14px;background:var(--surface);border:2px solid var(--select);border-radius:3px;cursor:nwse-resize;touch-action:none}
.marquee{position:absolute;border:1px solid var(--select);background:var(--select-soft);pointer-events:none;z-index:5}
.drag-ghost{position:fixed;z-index:60;pointer-events:none;padding:7px 14px;background:var(--surface);color:var(--ink);border:2px solid var(--chalk);border-radius:8px;box-shadow:0 8px 20px var(--shadow);font-weight:600;transform:translate(-50%,-70%);white-space:nowrap}
.drag-ghost .n{font-size:12px;color:var(--muted);margin-right:6px;font-weight:500}
body.is-dragging, body.is-dragging *{cursor:grabbing !important}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(460px, calc(100vw - 32px));max-height:calc(100vh - 32px);box-shadow:0 24px 60px var(--shadow)}
dialog.wide{width:min(660px, calc(100vw - 32px))}
dialog.wide.xwide{width:min(880px, calc(100vw - 32px))}
dialog::backdrop{background:rgba(12,22,18,.48)}
.dlg-form{display:flex;flex-direction:column;max-height:calc(100vh - 34px)}
.dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px 4px}
.dlg-head h2{margin:0;font-size:19px;font-weight:600;line-height:1.35;text-wrap:balance}
.dlg-head .sub{font-size:13px;color:var(--muted);margin-top:2px}
.xbtn{border:0;background:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);flex:none}
.xbtn:hover{background:var(--surface-2)}
.dlg-body{padding:8px 18px 14px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg-foot .left{margin-right:auto}
.field{display:flex;flex-direction:column;gap:6px}
.field > .lab{font-size:13px;font-weight:600;color:var(--muted)}
.opt-row{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:7px 13px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:500;min-height:36px}
.opt:hover{border-color:var(--focus)}
.opt[aria-pressed="true"]{background:var(--chalk);color:var(--chalk-ink);border-color:var(--chalk)}
.opt.t[aria-pressed="true"]{background:var(--att-bg);color:var(--att-ink);border-color:var(--att-edge);box-shadow:0 0 0 2px var(--att-edge) inset}
.opt-row.dim{opacity:.45}
.txt{height:38px;border:1px solid var(--line-strong);border-radius:8px;padding:0 10px;background:var(--surface);width:100%}
textarea.txt{height:auto;min-height:120px;padding:8px 10px;resize:vertical;font-variant-numeric:tabular-nums}
.txt:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.neis-prev{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px}
.neis-prev .lab{font-size:13px;font-weight:600;color:var(--muted)}
.mk{display:inline-block;padding:2px 9px;border-radius:6px;font-weight:600;font-size:13.5px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink);white-space:nowrap}
.mk.att-absent,.mk.att-late,.mk.att-early,.mk.att-result{background:var(--att-bg);border-color:var(--att-edge);color:var(--att-ink)}
.warn{color:var(--danger);font-size:12.5px;font-weight:500}
.history{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.history b{color:var(--ink);font-weight:600}
.history .row{display:flex;gap:8px}
.history .row .d{min-width:7.5em;font-variant-numeric:tabular-nums}
.drop-zone{border:2px dashed var(--line-strong);border-radius:12px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface-2)}
.drop-zone.over{border-color:var(--focus);background:var(--accent-soft)}
.drop-zone p{margin:0;font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-size:13px;margin:0}
.ok{color:var(--focus);font-size:13px;margin:0;font-weight:600}
.tbl-wrap{overflow:auto;max-height:260px;border:1px solid var(--line);border-radius:8px}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{position:sticky;top:0;background:var(--surface-2);font-weight:600;color:var(--muted)}
.tbl td.num{font-variant-numeric:tabular-nums;width:4.5em}
.tbl input{width:100%;height:32px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--surface)}
.tbl input.n{width:4.5em;font-variant-numeric:tabular-nums}
.radio-list{display:flex;flex-direction:column;gap:8px}
.radio-list label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.radio-list label:has(input:checked){border-color:var(--focus);background:var(--accent-soft)}
.radio-list small{display:block;color:var(--muted);font-size:12.5px}
.inline-nums{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.inline-nums label{display:flex;align-items:center;gap:6px;font-size:13.5px}
.inline-nums input{width:4.5em;height:34px;border:1px solid var(--line-strong);border-radius:8px;padding:0 8px;background:var(--surface);font-variant-numeric:tabular-nums}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.pick-grid .chip{cursor:pointer;touch-action:auto;justify-content:center}
.pick-grid .chip.seated{opacity:.6;font-weight:500}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.check input{margin-top:3px}
.gone-list{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.gone-list .lab{font-size:13px;font-weight:600;color:var(--muted)}
.gone-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.gone-row.purge{border-color:var(--danger)}
.gone-row .gn{flex:1 1 180px;display:flex;flex-direction:column;min-width:0}
.gone-row .gn b{font-weight:600;font-variant-numeric:tabular-nums}
.gone-row .gn small{font-size:12px;color:var(--muted)}
.gone-row.purge .gn small{color:var(--danger)}
.class-rows{display:flex;flex-direction:column;gap:8px}
.class-rows .crow{display:flex;gap:6px;align-items:center}
.class-rows .crow .txt{flex:1;min-width:0}
.class-rows .crow.cur .txt{border-color:var(--focus)}
.color-rows{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center}
.color-rows input[type=color]{width:56px;height:34px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:2px;cursor:pointer}
.preview-desk{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:96px;height:56px;border-radius:6px;border:1px solid var(--att-edge);background:var(--att-bg);color:var(--att-ink);font-size:12px;line-height:1.25}
.preview-desk b{font-size:15px}
.muted{color:var(--muted)}
.msg-top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.msg-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:stretch}
.msg-cols textarea{min-height:300px;font-size:14px;line-height:1.6;font-variant-numeric:normal}
.chat{background:#B9CCDD;border-radius:12px;padding:14px 12px;display:flex;flex-direction:column;gap:6px;min-height:300px;overflow:auto;color-scheme:light}
.chat .day{align-self:center;font-size:11.5px;color:#4A5A68;background:rgba(255,255,255,.5);padding:2px 10px;border-radius:10px;border:0}
.chat .line{display:flex;justify-content:flex-end;align-items:flex-end;gap:6px}
.chat .tm{font-size:10.5px;color:#4A5A68;white-space:nowrap}
.chat .bub{max-width:86%;background:#FFE94A;color:#1B1B1B;border-radius:12px 2px 12px 12px;padding:9px 11px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;font-family:var(--font-body)}
.chat .who{align-self:flex-end;font-size:11.5px;color:#4A5A68}
.msg-list{display:flex;flex-direction:column;gap:10px}
.msg-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.msg-item .mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.msg-item .mh b{font-weight:600}
.msg-item pre{margin:0;white-space:pre-wrap;font-family:var(--font-body);font-size:13px;line-height:1.55;background:var(--surface-2);border-radius:8px;padding:8px 10px;max-height:170px;overflow:auto}
@media (max-width:700px){.msg-cols{grid-template-columns:minmax(0,1fr)}}
.cover{position:fixed;inset:0;z-index:100;background:rgba(12,22,18,.58);display:flex;align-items:center;justify-content:center;padding:16px}
.cover-card{background:var(--surface);color:var(--ink);border-radius:14px;max-width:470px;width:100%;padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px var(--shadow)}
.cover-card h2{margin:0;font-size:19px;font-weight:600}
.cover-card p{margin:0;font-size:14px;line-height:1.65;color:var(--muted)}
.cover-card .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cover-card small{font-size:12.5px;color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;z-index:80;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.print-head{display:none}
.pside{display:none}
.pcount{display:grid;grid-template-columns:repeat(3,1fr);border-top:1.5px solid var(--rule);border-left:1.5px solid var(--rule)}
.pcount > div{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.pcount > div:nth-child(3n){border-right-width:1.5px}
.pcount > div:nth-last-child(-n+3){border-bottom-width:1.5px}
.pcount .pl{font-size:13px;font-weight:600;padding:1.2mm 0;background:var(--surface-2)}
.pcount .pn{font-family:var(--font-display);font-size:46px;line-height:1;padding:2.5mm 0 2mm;font-variant-numeric:tabular-nums;border-bottom-width:1.5px}
.pcount .pn small{font-size:16px;margin-left:2px;align-self:flex-end;padding-bottom:1.5mm}
.pcount .psub{font-size:11.5px;font-weight:500;color:var(--muted);padding:1mm 0;background:var(--surface-2)}
.pcount .pb{height:11mm;font-size:18px;color:var(--faint)}
.pgrid{flex:1 1 0;min-height:0;display:grid;grid-template-columns:14mm 24mm minmax(0,1fr);border-top:1.5px solid var(--rule);border-left:1.5px solid var(--rule)}
.pgrid > div{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:13px}
.pgrid > div:nth-child(3n){border-right-width:1.5px}
.pgrid > div:nth-last-child(-n+3){border-bottom-width:1.5px}
.pgrid .ph{background:var(--surface-2);font-weight:600;font-size:12.5px}
.pgrid .pp{font-weight:600}

.bell{display:inline-flex;align-items:center;gap:7px;margin-bottom:6px;height:32px;padding:0 12px;white-space:nowrap;flex:none;border-radius:8px;border:1px solid var(--chalk-line);background:var(--chalk-2);color:var(--chalk-ink);font-weight:600;font-size:13.5px;cursor:pointer}
.bell:hover{border-color:var(--chalk-ink)}
.bell .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;font-size:12px;line-height:20px;text-align:center;background:var(--c-late);color:var(--c-late-ink);font-variant-numeric:tabular-nums}
.bell.hot .badge{background:var(--c-absent);color:var(--c-absent-ink)}
.bell-ic{display:inline-flex}.bell-ic svg{width:15px;height:15px;display:block}
.ev-list{display:flex;flex-direction:column;gap:10px}
.ev{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.ev.over{border-color:var(--danger)}
.ev.done{opacity:.72}
.ev-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.ev-h .who{font-weight:600;font-size:14.5px}
.ev-h .who .n{color:var(--muted);font-weight:500;margin-right:4px;font-variant-numeric:tabular-nums}
.ev-h .when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev-h .sp{flex:1 1 auto}
.due{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);white-space:nowrap}
.due.soon{background:var(--c-late);border-color:var(--c-late-edge);color:var(--c-late-ink)}
.due.over{background:var(--c-absent);border-color:var(--c-absent-edge);color:var(--c-absent-ink)}
.due.ok{background:var(--accent-soft);border-color:var(--fixture-edge);color:var(--focus)}
.ev-b{display:flex;flex-wrap:wrap;gap:8px 16px;padding:10px 12px;align-items:flex-start}
.ev-docs{flex:1 1 260px;display:flex;flex-direction:column;gap:5px;min-width:0}
.ev-docs label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.ev-docs label input{margin-top:3px}
.ev-docs label.got span{color:var(--muted);text-decoration:line-through}
.ev-notes{margin:2px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.ev-act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ev-why{padding:7px 12px;font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--focus);border-bottom:1px solid var(--line)}
.ev-why.over{background:var(--c-absent);color:var(--c-absent-ink)}
.ev-month{border:1px solid var(--c-late-edge);background:var(--surface);border-radius:10px;overflow:hidden}
.ev-month .ev-h{background:var(--c-late);color:var(--c-late-ink);border-bottom-color:var(--c-late-edge)}
.sumtop{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--muted)}
.sumtop b{color:var(--ink);font-weight:600}
.sumwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-height:min(60vh,560px);overflow-y:auto}
.sumtbl{width:100%;min-width:600px;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.sumtbl th,.sumtbl td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.sumtbl thead th{position:sticky;top:0;background:var(--surface);font-size:12px;font-weight:600;color:var(--muted);z-index:1;white-space:nowrap}
.sumtbl td.rec{white-space:nowrap}
.sumtbl td.rec .due{display:inline-block;margin-top:4px}
.sumtbl td.items{min-width:230px}
.sumtbl td.items li{line-height:1.45}
.sumtbl tr.grp td{background:var(--surface-2);font-weight:600;font-size:13px;padding:5px 10px}
.sumtbl tr.grp td .muted{font-weight:400}
.sumtbl td.who{white-space:nowrap;font-weight:600}
.sumtbl td.who .n{color:var(--muted);font-weight:500;margin-right:4px}
.sumtbl td.c{text-align:center;width:1%;white-space:nowrap}
.sumtbl td.memo{color:var(--muted);font-size:12.5px}
.sumtbl tr.done td:not(.c){color:var(--faint);text-decoration:line-through}
.sumtbl tr.done td .mk{opacity:.6}
.sumtbl .mk{font-size:12px;white-space:nowrap}
.sumtbl ul{margin:0;padding-left:16px}
.sumtbl td .due{white-space:nowrap}
.nz-files{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.nz-files b{color:var(--ink);font-weight:600}
.nz-sum{display:flex;flex-wrap:wrap;gap:8px}
.nz-tile{border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-width:110px;background:var(--surface)}
.nz-tile b{display:block;font-size:20px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.nz-tile span{font-size:12px;color:var(--muted)}
.nz-tile.warn{border-color:var(--c-late-edge);background:color-mix(in srgb,var(--c-late) 30%,var(--surface))}
.nz-tile.bad{border-color:var(--danger)}
.nz-tile.bad b{color:var(--danger)}
details.nz{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.nz.nz-warn{border-color:var(--c-late-edge)}
details.nz.nz-bad{border-color:var(--danger)}
details.nz>summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:14px;list-style:none;display:flex;gap:8px;align-items:center}
details.nz>summary::-webkit-details-marker{display:none}
details.nz>summary::before{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details.nz[open]>summary::before{transform:rotate(45deg)}
details.nz>summary small{font-weight:400;color:var(--muted);font-size:12.5px}
details.nz .sumwrap{border:0;border-top:1px solid var(--line);border-radius:0 0 10px 10px;max-height:300px}
details.nz .nz-note{margin:0;padding:0 12px 10px;font-size:12.5px;color:var(--muted)}
.nz-arrow{color:var(--muted);padding:0 4px}
.rl{display:flex;flex-direction:column;gap:14px}
.rl-top{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 12px;background:var(--surface-2);border-radius:10px;font-size:13px;color:var(--muted)}
.rl-top .sp{flex:1 1 auto}
.rl-sec{border:1px solid var(--line);border-radius:12px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:4px;background:var(--surface);scroll-margin-top:8px}
.rl-sec h3{margin:0 0 4px;font-size:15.5px;font-weight:700;letter-spacing:-.01em;display:flex;gap:8px;align-items:baseline}
.rl-sec h3 small{font-weight:400;font-size:12.5px;color:var(--muted)}
.rl-note{margin:0 0 4px;font-size:12.5px;color:var(--muted);line-height:1.5}
.rl-line{margin:0;font-size:14.5px;line-height:2.3}
.rl-line input.txt{width:4.4em;height:32px;padding:0 4px;text-align:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;margin:0 3px;vertical-align:middle}
.rl-line input.txt.wide{width:min(16em,100%);text-align:left;font-weight:600;padding:0 10px}
.rl-line select.txt{width:auto;height:32px;margin:0 3px;vertical-align:middle;padding:0 8px}
.rl-line .calc{color:var(--muted);font-size:13px}
.rl-cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px;margin-top:4px}
.rl-case{border:1px solid var(--line);border-radius:10px;padding:9px 10px 8px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.rl-case h4{margin:0;font-size:13.5px;font-weight:700}
.rl-case h4 small{font-weight:400;color:var(--muted);font-size:12px}
.rl-items{display:flex;flex-direction:column;gap:5px}
.rl-item{display:flex;gap:6px;align-items:center}
.rl-item input.txt{flex:1 1 auto;min-width:0;height:32px;font-size:13.5px;padding:0 8px}
.rl-sc{font-size:12px;white-space:nowrap;color:var(--muted);align-items:center !important;gap:4px !important}
.rl-sc input{margin:0 !important}
.rl-del{width:28px;height:28px;flex:0 0 auto;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
.rl-del:hover{color:var(--danger);border-color:var(--danger)}
.rl-add{align-self:flex-start;font-size:12.5px !important;margin-top:1px}
.rl-empty{font-size:12.5px;color:var(--muted)}
#rulesPrint{display:none}
@page rules{size:A4 portrait;margin:12mm}
@media print{
  body.print-rules>*:not(#rulesPrint){display:none !important}
  body.print-rules #rulesPrint{display:block;page:rules;color:#111;font-size:10.5pt;line-height:1.45}
  #rulesPrint h1{font-family:var(--font-display);font-weight:400;font-size:22pt;margin:0}
  #rulesPrint .sub{color:#555;font-size:9.5pt;margin:2px 0 10px}
  #rulesPrint .cols{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
  #rulesPrint h2{font-size:11.5pt;margin:8px 0 3px;border-bottom:1.5px solid #333;padding-bottom:2px}
  #rulesPrint ul{margin:0;padding-left:16px}
  #rulesPrint li{margin:1px 0}
  #rulesPrint table{width:100%;border-collapse:collapse;font-size:9.5pt;margin-top:2px}
  #rulesPrint td,#rulesPrint th{border:1px solid #999;padding:3px 6px;vertical-align:top;text-align:left}
  #rulesPrint th{background:#EEF2EF;width:32%;font-weight:600}
  #rulesPrint .sch{color:#666;font-size:8.5pt}
}
.ev-group{border:1px solid var(--line-strong);border-radius:14px;background:var(--surface-2);padding:6px 8px 8px;display:flex;flex-direction:column;gap:8px}
.ev-group-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:4px 4px 0}
.ev-group-h .who{font-weight:700;font-size:15px}
.ev-group-h .who .n{color:var(--muted);font-weight:500;margin-right:4px;font-variant-numeric:tabular-nums}
.ev-group-h .cnt{font-size:13px;color:var(--muted)}
.ev-group-h .sp{flex:1 1 auto}
.ev-group .ev{border-radius:10px}
.msg-incl{display:flex;flex-wrap:wrap;gap:6px 18px}
.msg-incl .check{align-items:center}
.msg-incl .check input{margin-top:0}
.msg-item .mh .mk{font-size:12px}
.ev-sec{font-size:13px;font-weight:600;color:var(--muted);margin:4px 0 -2px}
.kind-row{display:flex;flex-direction:column;gap:6px}
.doc-hint{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 12px;line-height:1.55}
.doc-hint b{color:var(--ink);font-weight:600}

/* register (출석부) */
.reg-in{max-width:1500px;margin:0 auto;padding-block:14px 32px;display:flex;flex-direction:column;gap:12px}
.reg-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.reg-bar .range{display:flex;align-items:center;gap:6px;color:var(--muted)}
.reg-bar .range input{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface);font-variant-numeric:tabular-nums}
.reg-sum{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;color:var(--muted)}
.reg-sum .period{color:var(--ink);font-weight:600}
.chipx{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.chipx.todo{background:var(--c-late);border-color:var(--c-late-edge);color:var(--c-late-ink)}
.chipx.done{background:var(--accent-soft);border-color:var(--fixture-edge);color:var(--focus)}
.chipx.bad{border-color:var(--danger);color:var(--danger)}
button.chipx:not(.done)::after{content:"";width:5px;height:5px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);margin:0 1px 0 -1px;opacity:.75}
button.chipx:not(.done):hover{filter:brightness(.95)}
.reg-tabs{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.reg-body{display:flex;flex-direction:column;gap:14px;min-width:0}
.day,.stu{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.day-h,.stu-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.day-h h3,.stu-h h3{margin:0;font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums}
.day-h .cnt,.stu-h .cnt{font-size:13px;color:var(--muted)}
.day-h .sp,.stu-h .sp{flex:1 1 auto}
.rt-wrap{overflow-x:auto}
.rtbl{border-collapse:collapse;width:100%;font-size:14px;table-layout:fixed;min-width:820px}
.rtbl th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.rtbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.rtbl tr:last-child td{border-bottom:0}
.rtbl tbody tr{cursor:pointer}
.rtbl tbody tr:hover td{background:var(--surface-2)}
.rtbl th.evc{width:12.5em}.rtbl td.evc{cursor:default}
.evl{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;padding:2px 4px;border-radius:6px}
.evl:hover{background:var(--surface-2)}
.evm{display:flex;flex-wrap:nowrap;align-items:center;gap:2px 8px;margin-top:2px;padding-left:4px}
.evs{font-size:12px;color:var(--muted);white-space:nowrap}
.evs.soon{color:var(--c-late-ink);font-weight:600}
.evs.over{color:var(--danger);font-weight:600}
.evs.ok{color:var(--focus)}
.linkish{border:0;background:none;padding:0 2px;font:inherit;font-size:12px;color:var(--focus);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.rtbl th.n{width:3.5em}.rtbl th.nm{width:8em}.rtbl th.dt{width:8.5em}.rtbl th.mkc{width:15.5em}.rtbl th.pc{width:9em}.rtbl th.nb{width:7.5em}
.rtbl td{overflow-wrap:anywhere}
.rtbl td.n{width:3.5em;font-variant-numeric:tabular-nums;color:var(--muted)}
.rtbl td.nm{width:8em;font-weight:600;white-space:nowrap}
.rtbl td.dt{width:8.5em;white-space:nowrap;font-variant-numeric:tabular-nums}
.rtbl td.mkc{width:11em}
.rtbl td.pc{width:8em;white-space:nowrap;font-variant-numeric:tabular-nums}
.per-row{gap:6px}
.per-chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.opt.per{min-width:40px;padding:6px 8px;min-height:34px;text-align:center}
.per-tip{font-size:12.5px}
.mwarn{font-size:13px;line-height:1.5;color:var(--c-absent-ink);background:var(--c-absent);border:1px solid var(--c-absent-edge);border-radius:8px;padding:8px 12px}
.mwarn b{font-weight:600}
.rtbl td.memo{color:var(--ink);min-width:12em}
.rtbl td.nb{width:7.5em;white-space:nowrap}
.rtbl td.nb label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px}
.rtbl td.nb label:hover{background:var(--surface)}
.rtbl tr.isdone td{color:var(--muted)}
.rtbl tr.isdone .mk{opacity:.75}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:0 6px;border-radius:5px;border:1px solid var(--line-strong);color:var(--muted);margin-left:6px;vertical-align:1px}
.reg-empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.reg-empty b{color:var(--ink);font-size:16px}
.reg-note{font-size:13px;color:var(--muted)}
.grid-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 230px);min-width:0}
.grid-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.grid-row>.grid-wrap{flex:0 1 auto;max-width:100%}
.chk{flex:1 1 290px;min-width:min(100%,270px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 10px;display:flex;flex-direction:column;gap:11px}
.chk-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chk-h b{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.chk-h b .cnt{display:inline-block;margin-left:6px;min-width:20px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;line-height:19px;text-align:center;vertical-align:2px}
.chk-h b .cnt.warn{background:var(--c-late);color:var(--c-late-ink)}
.chk-yr{font-size:12px;color:var(--muted)}
.chk-secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px 18px;align-items:start}
.chk-sec h4{margin:0 0 5px;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:-.01em}
.chk-sec h4 small{font-weight:400;color:var(--faint)}
.chk-sec ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.chk-it{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;row-gap:1px;align-items:baseline;width:100%;text-align:left;border:0;border-left:3px solid var(--lv);background:var(--lv-bg);border-radius:4px 8px 8px 4px;padding:5px 8px 5px 9px;cursor:pointer;font:inherit;font-size:13.5px;color:var(--ink)}
.chk-it:hover{filter:brightness(.97)}
.chk-it .who{font-weight:600;white-space:nowrap}
.chk-it .main{font-weight:700;color:var(--lv-ink)}
.chk-it .sub{grid-column:1/-1;font-size:12px;color:var(--muted);line-height:1.4}
li.lv-bad{--lv:var(--danger);--lv-ink:var(--danger);--lv-bg:color-mix(in srgb,var(--danger) 7%,transparent)}
li.lv-warn{--lv:var(--c-late-edge);--lv-ink:var(--ink);--lv-bg:color-mix(in srgb,var(--c-late) 38%,transparent)}
li.lv-soon{--lv:var(--line-strong);--lv-ink:var(--ink);--lv-bg:var(--surface-2)}
.chk-none{margin:0;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.chk-none::before{content:"✓";color:var(--focus);font-weight:700}
.chk-f{display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center;border-top:1px solid var(--line);padding-top:8px;font-size:11.5px;color:var(--faint)}
.chk-f .linkish{font-size:12px}
.gtbl tr.flash td{animation:rowflash 1.8s ease}
@keyframes rowflash{0%,45%{background:var(--accent-soft)}}
.gtbl{border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
.gtbl th,.gtbl td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:0;background:var(--surface)}
.gtbl thead th{position:sticky;z-index:2;background:var(--surface-2);font-weight:600;color:var(--muted);font-size:12px}
.gtbl thead tr:first-child th{top:0;height:26px}
.gtbl thead tr:nth-child(2) th{top:26px;height:38px;line-height:1.15}
.gtbl thead th small{display:block;font-weight:500;font-size:11px}
.gtbl thead th.sat small,.gtbl thead th.sun small{color:var(--danger)}
.gtbl thead th.today{background:var(--accent-soft);color:var(--focus)}
.gtbl .sn{position:sticky;left:0;z-index:1;min-width:38px;width:38px;color:var(--muted)}
.gtbl .sm{position:sticky;left:38px;z-index:1;min-width:76px;text-align:left;padding:0 8px;font-weight:600;white-space:nowrap;border-right:1.5px solid var(--line-strong)}
.gtbl thead .sn,.gtbl thead .sm{z-index:3}
.gtbl td.gc{width:40px;min-width:40px;height:32px}
.gtbl td.gc button{width:100%;height:32px;border:0;padding:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font:inherit}
.gtbl td.gc button:hover{background:var(--surface-2)}
.gchip.sym{min-width:28px;height:22px;padding:0}
.gchip.sym svg{width:16px;height:16px;display:block}
.symr{stroke:var(--sym-red)}
.sym-legend{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.sl-wrap{display:flex;flex-direction:column;gap:4px;min-width:0;overflow-x:auto;max-width:100%}
.sl-title{font-size:12.5px;font-weight:600;color:var(--muted)}
.sl{border-collapse:collapse;font-size:12px;text-align:center}
.sl th,.sl td{border:1px solid var(--line);padding:2px 3px;min-width:34px}
.sl th{font-weight:600;background:var(--att-bg);color:var(--att-ink);padding:3px 4px}
.sl td.lb{color:var(--muted);font-size:11.5px;white-space:nowrap}
.sl td.lb.red{color:var(--sym-red);font-weight:600}
.sl td .gchip{margin:1px auto}
.sl-side{display:flex;flex-direction:column;gap:6px;flex:1 1 240px;min-width:0}
.sl-side .seg{align-self:flex-start}
.sl-notes{margin:0;padding-left:16px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;line-height:1.5}
.seg.sm button{padding:4px 11px;font-size:13px}
@media print{.noprint{display:none !important}}
.reg-print-head{display:none}
@media print{
  body.print-reg .reg-print-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 3mm}
  body.print-reg .reg-print-head h1{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0}
  body.print-reg .reg-print-head span{font-size:12px;color:#444}
  body.print-reg .reg-sum{display:none !important}
  body.print-reg .reg-in{gap:3mm}
  body.print-reg .sym-legend{border:0;padding:0;gap:4mm}
  body.print-reg .sl-notes{font-size:10.5px}
  body.print-reg .grid-wrap{border:0;border-radius:0;overflow:visible;max-height:none}
  body.print-reg .gtbl th,body.print-reg .gtbl td{position:static !important}
  body.print-reg .gtbl th,body.print-reg .gtbl td{border-right-width:var(--pbw,1px);border-bottom-width:var(--pbw,1px);border-color:#9AA5A0}
  body.print-reg .gtbl thead{display:table-header-group}
  body.print-reg .gtbl tfoot{display:table-row-group}
  body.print-reg .gtbl tr{break-inside:avoid}
  body.print-reg .grid-row{flex-wrap:nowrap;gap:12px}
  body.print-reg.chk-below .grid-row{display:block}
  body.print-reg.chk-side .chk{flex:1 1 0;min-width:0}
  body.print-reg.chk-below .chk{margin-top:10px}
  body.print-reg .chk{border-color:#999;break-inside:avoid}
  body.print-reg .chk-it{padding:3px 6px 3px 7px;font-size:12.5px}
  body.print-reg .chk-sec ul{gap:2px}
  body.print-reg .gtbl td.gc.today,body.print-reg .gtbl thead th.today{background:var(--surface)}
}
.gchip{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:27px;height:20px;padding:0 3px;border-radius:5px;font-size:11px;font-weight:600;letter-spacing:-.03em;line-height:1;white-space:nowrap;background:var(--att-bg);color:var(--att-ink);border:1px solid var(--att-edge)}
.gchip.dup{outline:2px solid var(--danger);outline-offset:1px}
.gchip.todo::after{content:"";position:absolute;top:-3px;right:-3px;width:6px;height:6px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 1.5px var(--surface)}
.gtbl td.gc.off{background:repeating-linear-gradient(135deg,var(--surface-2) 0 4px,var(--surface) 4px 8px)}
.gtbl td.gc.today{background:var(--accent-soft)}
.gtbl td.tot,.gtbl th.tot{min-width:40px;width:40px;font-weight:600}
.gtbl th.tot.first,.gtbl td.tot.first{border-left:1.5px solid var(--line-strong)}
.gtbl td.tot.z{color:var(--faint);font-weight:400}
.gtbl tfoot td{background:var(--surface-2);font-weight:600;font-size:12px;height:28px;position:sticky;bottom:0}
.gtbl tr.gone td.sm{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.batch-log{display:flex;flex-direction:column;gap:4px;font-size:13px;background:var(--surface-2);border-radius:8px;padding:10px 12px;max-height:150px;overflow:auto}
.batch-log .row{display:flex;gap:8px;align-items:center}
.batch-log .row .d{min-width:6.5em;font-variant-numeric:tabular-nums;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
select.txt{padding:0 8px}
.exist{font-size:13px;color:var(--muted);min-height:1.4em}
.exist b{color:var(--ink)}

@media (max-width: 780px){
  body[data-view="reg"] .datebar{display:none}
  .vtabs button{padding:8px 11px 9px;font-size:14px}
  .work{grid-template-columns:minmax(0,1fr)}
  .roster{position:static}
  .savestate{margin-left:0;width:100%}
}
@media (max-width: 440px){
  #bellText{display:none}
  .bell{padding:0 9px}
}
@media (prefers-reduced-motion: reduce){ .desk-card,.toast{transition:none} }
@page{size:A4 landscape;margin:10mm}
@media print{
  :root:not(#_){
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F3F6F4; --board:#FFFFFF; --ink:#111; --muted:#444; --faint:#777;
    --line:#BBB; --line-strong:#888; --chalk:#2B5A4A; --chalk-ink:#FFF; --desk:#FFF; --desk-edge:#999;
    --fixture:#DCEAD3; --fixture-ink:#2C4826; --fixture-edge:#9CB98F; color-scheme:light;
  }
  html,body{min-height:0;height:auto;background:#fff}
  .stage{gap:0}
  .scaler{overflow:hidden}
  .band,.toolbar,.summary,.roster,.hint,.banner,.toast,.reg-bar,.reg-tabs,.reg-sum .chipx,.vtabs-in,.ev-act{display:none !important}
  .grid-wrap{max-height:none;overflow:visible;border:0}
  .reg-in{padding:0}
  .day,.stu{break-inside:avoid}
  .work{display:block;padding:0;max-width:none}
  .board-wrap{border:0;padding:0;overflow:visible;border-radius:0}
  .print-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6mm}
  body.with-side .board-wrap{display:grid;grid-template-columns:minmax(0,1fr) 82mm;grid-template-rows:auto minmax(0,1fr);column-gap:8mm;height:184mm;overflow:hidden}
  body.with-side .print-head{grid-column:1/-1;margin-bottom:5mm}
  body.with-side .scaler{grid-column:1;grid-row:2;align-self:start}
  body.with-side .pside{display:flex;grid-column:2;grid-row:2;flex-direction:column;gap:3.5mm;min-height:0}
  .print-head h1{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0}
  .print-head span{font-size:13px;color:#444}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.print-no-att .desk.att .desk-card{background:var(--desk);border-color:var(--line-strong);border-bottom-color:var(--desk-edge)}
  body.print-no-att .desk.att .d-num,body.print-no-att .desk.att .d-name{color:var(--ink)}
  body.print-no-att .d-att{display:none}
  .d-plus{visibility:hidden}
  .d-pin{display:none}
}
</style>
</head>
<body>
<div id="rulesPrint" aria-hidden="true"></div>
<header class="band">
  <div class="band-in gut">
    <div class="title-col">
      <div class="eyebrow">
        <label for="classSelect">학급</label>
        <select id="classSelect" aria-label="학급 고르기"></select>
        <button class="bandbtn" id="classManageBtn" type="button"><span class="bic" aria-hidden="true"><svg viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h7"/></g></svg></span>반 관리 · 새 반</button>
        <button class="bandbtn" id="rulesBtn" type="button" title="우리 학교 출결 규정 보기·고치기"><span class="bic" aria-hidden="true"><svg viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M3.5 2.5h6l3 3v8h-9z"/><path d="M9.5 2.5v3h3M5.5 8.5h5M5.5 11h5"/></g></svg></span>출결 규정</button>
        <span class="filetag" id="fileTag" hidden></span>
      </div>
      <input id="classTitle" class="class-title" type="text" maxlength="40" aria-label="반 이름 (눌러서 바꾸기)" autocomplete="off" spellcheck="false">
      <span class="measure" id="titleMeasure" aria-hidden="true"></span>
    </div>
    <div class="datebar" role="group" aria-label="출결 날짜">
      <button class="dbtn" id="datePrev" type="button" aria-label="이전 수업일">‹</button>
      <input type="date" id="dateInput" aria-label="날짜">
      <span class="dow" id="dateDow" aria-hidden="true"></span>
      <button class="dbtn" id="dateNext" type="button" aria-label="다음 수업일">›</button>
      <button class="dbtn" id="dateToday" type="button">오늘</button>
    </div>
  </div>
  <div class="vtabs-in gut">
    <div class="vtabs" role="tablist" aria-label="화면">
      <button type="button" role="tab" id="tabBoard" aria-selected="true">자리 배치도</button>
      <button type="button" role="tab" id="tabReg" aria-selected="false">출석부<span class="badge" id="regBadge" hidden></span></button>
    </div>
    <div class="spacer"></div>
    <button type="button" class="bell" id="bellBtn" title="챙길 출결 서류 보기"><span class="bell-ic" aria-hidden="true"></span><span id="bellText">챙길 서류</span><span class="badge" id="bellBadge" hidden></span></button>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-in gut">
    <div class="seg" role="group" aria-label="모드">
      <button type="button" id="modeSeat" aria-pressed="true">학생 배치</button>
      <button type="button" id="modeEdit" aria-pressed="false">책상 편집</button>
    </div>
    <div class="tools" id="seatTools">
      <button class="btn" type="button" id="randomBtn">무작위 배치</button>
      <button class="btn" type="button" id="clearSeatsBtn">모두 비우기</button>
    </div>
    <div class="tools" id="editTools" hidden>
      <button class="btn" type="button" id="addDeskBtn">＋ 책상</button>
      <button class="btn" type="button" id="addFixtureBtn">＋ 교탁·문</button>
      <button class="btn" type="button" id="dupBtn">복제</button>
      <button class="btn" type="button" id="renameFxBtn" hidden>글자 바꾸기</button>
      <button class="btn danger" type="button" id="delBtn">삭제</button>
      <button class="btn" type="button" id="presetBtn">기본 틀</button>
      <span class="sel-count" id="selCount"></span>
    </div>
    <div class="spacer"></div>
    <div class="tools">
      <button class="btn" type="button" id="undoBtn" title="되돌리기 (Ctrl+Z)">↶ 되돌리기</button>
      <button class="btn" type="button" id="redoBtn" title="다시 실행 (Ctrl+Y)" aria-label="다시 실행">↷</button>
      <button class="btn" type="button" id="viewBtn"></button>

          <button type="button" data-act="export">엑셀로 내보내기</button>
          <button type="button" data-act="print" class="file-only">인쇄하기</button>
          <div class="sep"></div>
          <button type="button" data-act="roster">학생 명단 고치기</button>
          <button type="button" data-act="colors">출결 색상 바꾸기</button>
          <button type="button" data-act="rules">우리 학교 출결 규정</button>
          <button type="button" data-act="alarms">증빙서류 알림 설정</button>
          <div class="sep"></div>
          <button type="button" data-act="backup">백업 파일로 저장</button>
          <button type="button" data-act="restore">백업 파일 불러오기</button>
          <button type="button" data-act="openfolder">백업 폴더 열기</button>
          <button type="button" data-act="autobackup">자동 백업 설정</button>
          <div class="sep file-only"></div>
          <button type="button" data-act="newfile" class="file-only">새 파일 만들기 (새 학급용)</button>
          <div class="note" id="menuNote"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="summary">
  <div class="summary-in gut" id="summary"></div>
</div>

<main class="work gut">
  <aside class="roster" id="roster" aria-label="자리 없는 학생">
    <h2>자리 없는 학생</h2>
    <div class="meta" id="rosterMeta"></div>
    <div class="chips" id="unseated"></div>
    <div class="roster-actions">
      <button class="btn sm" type="button" id="importBtn">명단 불러오기</button>
      <button class="btn sm ghost" type="button" id="rosterEditBtn">명단 고치기</button>
    </div>
    <p class="tip" id="rosterTip"></p>
  </aside>
  <section class="stage">
    <div class="banner" id="sampleBanner" hidden>
      <p>지금은 <b>예시 명단</b>이에요. 우리 반 엑셀 명단을 불러오면 이 이름들은 사라져요.</p>
      <button class="btn sm primary" type="button" id="bannerImport">명단 불러오기</button>
      <button class="btn sm" type="button" id="bannerClear">예시 지우기</button>
    </div>
    <div class="board-wrap" id="boardWrap">
      <div class="print-head"><h1 id="printTitle"></h1><span id="printDate"></span></div>
      <div class="scaler" id="scaler"><div class="board" id="board"></div></div>
      <aside class="pside" id="pside" aria-hidden="true">
        <div class="pcount" id="pCount"></div>
        <div class="pgrid" id="pGrid"></div>
      </aside>
    </div>
    <div class="hint" id="hint"></div>
  </section>
</main>

<section class="reg" id="regView" hidden>
  <div class="reg-in gut">
    <div class="reg-print-head"><h1 id="regPrintTitle"></h1><span id="regPrintDate"></span></div>
    <div class="reg-bar">
      <div class="seg" role="group" aria-label="기간" id="regPresets">
        <button type="button" data-p="thisWeek">이번 주</button>
        <button type="button" data-p="lastWeek">지난 주</button>
        <button type="button" data-p="thisMonth">이번 달</button>
        <button type="button" data-p="lastMonth">지난 달</button>
      </div>
      <div class="range"><input type="date" id="regFrom" aria-label="시작 날짜"><span>~</span><input type="date" id="regTo" aria-label="끝 날짜"></div>
      <div class="spacer"></div>
      <button class="btn primary" type="button" id="regAdd">몰아서 입력하기</button>
      <button class="btn" type="button" id="regNeis" title="나이스에서 내려받은 출결 파일(학생별 출결 현황·일일출석부)을 불러와요">나이스 불러오기</button>
      <button class="btn" type="button" id="regNeisLog" title="나이스에서 불러온 파일 목록 · 불러오기 취소">불러온 파일</button>
      <input type="file" id="neisFile" accept=".xlsx,.csv,.xls,.htm,.html" multiple hidden>
      <button class="btn" type="button" id="regPrint" hidden>출석부 표 인쇄</button>
      <button class="btn" type="button" id="regExport">엑셀로 내보내기</button>
      <button class="btn" type="button" id="regUndo" title="되돌리기 (Ctrl+Z)">↶ 되돌리기</button>
    </div>
    <div class="reg-sum" id="regSum"></div>
    <div class="reg-tabs">
      <div class="seg" role="group" aria-label="보기" id="regTabs">
        <button type="button" data-t="date">날짜별</button>
        <button type="button" data-t="student">학생별</button>
        <button type="button" data-t="grid">출석부 표</button>
        <button type="button" data-t="docs">증빙 서류</button>
      </div>
      <label class="check" for="regTodo"><input type="checkbox" id="regTodo"> <span id="regTodoLab">나이스에 아직 안 옮긴 것만</span></label>
      <label class="check" for="regDocTodo" id="regDocTodoWrap"><input type="checkbox" id="regDocTodo"> <span>증빙서류 안 받은 것만</span></label>
    </div>
    <div class="reg-body" id="regBody"></div>
  </div>
</section>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function nameSize(n){const L=[...n].length;return L<=3?19:L===4?17:L===5?15:L===6?14:12.5;}

function computeGeo(){

  const b=boundsOf(items);let ox,oy,W,H;

/* ---------- pointer interactions ---------- */
let ptr=null;
function onDown(e){

    return;
  }
  if(!inBoard) return;

  if(deskEl||fxEl){
    const id=(deskEl||fxEl).dataset.id;
    if(e.shiftKey||e.ctrlKey||e.metaKey){if(selected.has(id))selected.delete(id);else selected.add(id);renderBoard();renderToolbar();begin(e,{kind:'none'});return;}
    if(!selected.has(id)){selected.clear();selected.add(id);renderBoard();renderToolbar();}
    const c=C();const orig=new Map();
    for(const sid of selected){const it=deskById(sid)||fxById(sid);if(it)orig.set(sid,{x:it.x,y:it.y});}
    begin(e,{kind:'move',orig,snap:snapshot()});return;

}
function begin(e,p){
  ptr={...p,pid:e.pointerId,sx:e.clientX,sy:e.clientY,moved:false,type:e.pointerType};
  window.addEventListener('pointermove',onMove,{passive:false});
  window.addEventListener('pointerup',onUp);

  if(p.kind!=='none') e.preventDefault();
}
function finish(){
  window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',onCancel);
  $$('.drag-ghost').forEach(g=>g.remove());$$('.drop').forEach(x=>x.classList.remove('drop'));$$('.src').forEach(x=>x.classList.remove('src'));$$('.marquee').forEach(x=>x.remove());
  document.body.classList.remove('is-dragging');ptr=null;
}
function onCancel(e){if(ptr&&e.pointerId===ptr.pid){const p=ptr;finish();if(p.kind==='move'||p.kind==='resize')renderBoard();}}
function onMove(e){

  e.preventDefault();
  if(ptr.kind==='student'){

    $$('.drop').forEach(x=>x.classList.remove('drop'));
    const tgt=hitTarget(e.clientX,e.clientY);
    if(tgt&&!(tgt.type==='desk'&&tgt.id===ptr.from)&&!(tgt.type==='roster'&&!ptr.from))tgt.el.classList.add('drop');
    if(e.clientY<48)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-48)window.scrollBy(0,14);
  }else if(ptr.kind==='move'){
    let bx=dx/geo.s,by=dy/geo.s;if(geo.flip){bx=-bx;by=-by;}
    let sx=snap(bx),sy=snap(by);
    let minX=Infinity,minY=Infinity;for(const o of ptr.orig.values()){minX=Math.min(minX,o.x);minY=Math.min(minY,o.y);}
    sx=Math.max(sx,-minX);sy=Math.max(sy,-minY);ptr.delta=[sx,sy];
    for(const [id,o] of ptr.orig){const node=$(`#board [data-id="${id}"]`);if(!node)continue;const it=deskById(id)||fxById(id);const w=it.w??DW,hh=it.h??DH;const [x,y]=toDisp(o.x+sx,o.y+sy,w,hh);node.style.left=x+'px';node.style.top=y+'px';}
  }else if(ptr.kind==='marquee'){

    let m=$('.marquee');if(!m){m=h('div',{class:'marquee'});$('#board').append(m);}
    const x=Math.min(ptr.ax,bx),y=Math.min(ptr.ay,by),w=Math.abs(bx-ptr.ax),hh=Math.abs(by-ptr.ay);

    const node=$(`#board [data-id="${ptr.id}"]`);if(node){node.style.width=w+'px';node.style.height=hh+'px';}

}
function startDrag(e){

}
function hitTarget(x,y){

      c.desks.forEach(d=>{if(hit(d.x,d.y,DW,DH))selected.add(d.id);});c.fixtures.forEach(f=>{if(hit(f.x,f.y,f.w,f.h))selected.add(f.id);});}

function dropStudent(p,tgt){

/* ---------- edit actions ---------- */
function overlaps(x,y,w,hh,skip){const c=C();const all=[...c.desks.map(d=>({id:d.id,x:d.x,y:d.y,w:DW,h:DH})),...c.fixtures];return all.some(o=>(!skip||!skip.has(o.id))&&x<o.x+o.w+4&&x+w+4>o.x&&y<o.y+o.h+4&&y+hh+4>o.y);}

  for(let y=y0;y<=y1+hh;y+=16)for(let x=x0;x<=x1+w+24;x+=16){if(!overlaps(x,y,w,hh))return [snap(x),snap(y)];}return [snap(x1+24),snap(y0)];}

function addFixture(kind,label){pushUndo();const [x,y]=findFreeSpot(kind.w,kind.h);const f={id:uid(),type:kind.type,label:label||kind.label,x,y,w:kind.w,h:kind.h};C().fixtures.push(f);selected.clear();selected.add(f.id);commit();toast(`${f.label}을(를) 추가했어요`);}
function deleteSelected(){

  const c=C();pushUndo();let freed=0;

  const b=boundsOf(items);let off=[snap(b.x1-b.x0+24),0];

let nudgeAt=0;
function nudge(dx,dy){

/* ---------- roster import ---------- */
function colIndex(letters){let n=0;for(const ch of letters.toUpperCase())n=n*26+(ch.charCodeAt(0)-64);return n-1;}
async function readXlsx(buf){
  if(!window.JSZip)throw new Error('NOZIP');

  const P=s=>new DOMParser().parseFromString(s,'application/xml');

  let shared=[];const ss=await get('xl/sharedStrings.xml');
  if(ss)shared=T(P(ss),'si').map(si=>T(si,'t').filter(t=>{const pn=t.parentNode&&t.parentNode.localName;return pn==='si'||pn==='r';}).map(t=>t.textContent).join(''));
  let paths=[];const wb=await get('xl/workbook.xml'),rels=await get('xl/_rels/workbook.xml.rels');
  if(wb&&rels){const rmap={};T(P(rels),'Relationship').forEach(r=>{rmap[r.getAttribute('Id')]=r.getAttribute('Target');});
    T(P(wb),'sheet').forEach(s=>{const rid=s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||s.getAttribute('r:id');let t=rmap[rid];if(!t)return;t=t.replace(/^\//,'');if(!t.startsWith('xl/'))t='xl/'+t;paths.push(t);});}
  if(!paths.length)paths=Object.keys(zip.files).filter(p=>/^xl\/worksheets\/sheet\d+\.xml$/.test(p)).sort();
  const sheets=[];
  for(const p of paths){const x=await get(p);if(!x)continue;const doc=P(x);const rows=[];
    T(doc,'row').forEach((rowEl,ri)=>{const rn=parseInt(rowEl.getAttribute('r'))||ri+1;const arr=[];let ci=0;
      T(rowEl,'c').forEach(c=>{const ref=c.getAttribute('r');if(ref)ci=colIndex(ref.replace(/[0-9$]/g,''));const t=c.getAttribute('t');let v='';
        if(t==='inlineStr')v=T(c,'t').map(n=>n.textContent).join('');else{const ve=T(c,'v')[0];v=ve?ve.textContent:'';if(t==='s')v=shared[parseInt(v)]??'';}
        arr[ci]=v;ci++;});
      rows[rn-1]=Array.from(arr,v=>v??'');});
    sheets.push(Array.from(rows,r=>r||[]));}
  return sheets;
}
function decodeText(u8){try{return new TextDecoder('utf-8',{fatal:true}).decode(u8).replace(/^﻿/,'');}catch(e){try{return new TextDecoder('euc-kr').decode(u8);}catch(e2){return new TextDecoder().decode(u8);}}}
function csvRows(text){const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}else{if(ch==='"')q=true;else if(ch===','){row.push(cur);cur='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur='';}else cur+=ch;}}if(cur!==''||row.length){row.push(cur);rows.push(row);}return rows;}
function textRows(text){
  const lines=text.replace(/^﻿/,'').split(/\r?\n/);
  if(lines.some(l=>l.includes('\t')))return lines.map(l=>l.split('\t'));
  if(lines.filter(l=>l.includes(',')).length>=Math.max(1,lines.filter(l=>l.trim()).length*0.6))return csvRows(text);
  return lines.map(l=>{const p=l.trim().split(/\s+/);if(p.length>1&&/^\d+\.?$/.test(p[0]))return [p[0].replace('.',''),p.slice(1).join(' ')];return [l.trim()];});
}

async function fileToSheets(file){
  const buf=await file.arrayBuffer();const u8=new Uint8Array(buf);
  if(u8[0]===0x50&&u8[1]===0x4B)return await readXlsx(buf);
  if(u8[0]===0xD0&&u8[1]===0xCF&&u8[2]===0x11&&u8[3]===0xE0)throw new Error('OLDXLS');
  const text=decodeText(u8);
  if(/<table/i.test(text.slice(0,5000))||/^\s*<(!doctype|html)/i.test(text))return [htmlTableRows(text)];
  return [textRows(text)];
}
const norm=v=>String(v??'').replace(/\s+/g,'').trim();
function rowsToStudents(rows){
  const NAME=/^(이름|성명|학생명|학생이름|성함|name)$/i, NUM=/^(번호|번|출석번호|학생번호|no\.?|num|number)$/i, HAK=/^학번$/;
  let hr=-1,nameCol=-1,numCol=-1,hakCol=-1;
  for(let r=0;r<Math.min(rows.length,20);r++){const row=rows[r]||[];let nc=-1,mc=-1,hc=-1;row.forEach((v,i)=>{const s=norm(v);if(nc<0&&NAME.test(s))nc=i;else if(mc<0&&NUM.test(s))mc=i;else if(hc<0&&HAK.test(s))hc=i;});if(nc>=0){hr=r;nameCol=nc;numCol=mc;hakCol=hc;break;}}
  const out=[];
  const okName=s=>s&&s.length<=30&&!/^\d+(\.\d+)?$/.test(s)&&!/^(합계|계|비고|남|여|성별|이름|성명)$/.test(s);
  if(hr>=0){
    for(let r=hr+1;r<rows.length;r++){const row=rows[r]||[];const name=String(row[nameCol]??'').trim().replace(/\s+/g,' ');if(!okName(name))continue;
      let num=null;if(numCol>=0){const m=String(row[numCol]??'').match(/\d+/);if(m)num=parseInt(m[0]);}
      if(num==null&&hakCol>=0){const m=String(row[hakCol]??'').match(/\d+/);if(m){const v=parseInt(m[0]);num=v>=1000?v%100:v;}}
      out.push({num,name});}
  }else{
    for(const row of rows){const cells=(row||[]).map(v=>String(v??'').trim()).filter(v=>v!=='');if(!cells.length)continue;
      let got=false;for(let i=0;i<cells.length-1;i++){if(/^\d{1,3}$/.test(cells[i])&&okName(cells[i+1])){const n=parseInt(cells[i]);if(n>=1&&n<=200){out.push({num:n,name:cells[i+1]});got=true;break;}}}
      if(!got){const texts=cells.filter(okName);if(texts.length===1&&cells.length<=2)out.push({num:null,name:texts[0]});}}
  }
  let max=out.reduce((m,s)=>Math.max(m,s.num||0),0);
  out.forEach(s=>{if(s.num==null)s.num=++max;});
  const seen=new Set();return out.filter(s=>{const k=s.num+'|'+s.name;if(seen.has(k))return false;seen.add(k);return true;}).sort(byNum);
}
function sheetsToStudents(sheets){for(const rows of sheets){const r=rowsToStudents(rows);if(r.length)return r;}return [];}

function applyRoster(list,how){
  const c=C();pushUndo();let moved=0;
  if(how==='replace'){
    if(c.sample){c.students=[];c.attendance={};c.desks.forEach(d=>d.sid=null);c.sample=false;}
    const all=c.students,used=new Set(),next=[];const today=todayStr();
    for(const n of list){const m=all.find(o=>!used.has(o.id)&&o.name===n.name&&o.num===n.num)||all.find(o=>!used.has(o.id)&&o.name===n.name);
      if(m){used.add(m.id);const st={...m,num:n.num,name:n.name};delete st.left;next.push(st);}else next.push({id:uid(),num:n.num,name:n.name});}
    for(const o of all){if(used.has(o.id))continue;if(o.left)next.push(o);else if(hasRecords(c,o.id)){next.push({...o,left:today,fixed:false});moved++;}}
    c.students=next;
  }else{
    for(const n of list){const ex=c.students.find(s=>s.name===n.name&&s.num===n.num);if(ex){delete ex.left;}else c.students.push({id:uid(),num:n.num,name:n.name});}
  }
  const ok=new Set(c.students.filter(s=>!s.left).map(s=>s.id));c.desks.forEach(d=>{if(d.sid&&!ok.has(d.sid))d.sid=null;});
  const keep=new Set(c.students.map(s=>s.id));
  for(const dt of Object.keys(c.attendance)){for(const k of Object.keys(c.attendance[dt]))if(!keep.has(k))delete c.attendance[dt][k];if(!Object.keys(c.attendance[dt]).length)delete c.attendance[dt];}
  commit();toast(`${list.length}명을 불러왔어요`+(moved?` · 새 명단에 없는 ${moved}명은 출결 기록을 남기고 명단에서 뺐어요`:'. 이름을 끌어서 자리에 앉히세요'));
}

function addDays(d,n){const x=parseDate(d);x.setDate(x.getDate()+n);return fmtDate(x);}
function weekStart(d){const x=parseDate(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return fmtDate(x);}
function presetRange(p){const t=todayStr(),x=parseDate(t);
  if(p==='thisWeek'){const a=weekStart(t);return [a,addDays(a,4)];}
  if(p==='lastWeek'){const a=addDays(weekStart(t),-7);return [a,addDays(a,4)];}
  if(p==='lastMonth')return [fmtDate(new Date(x.getFullYear(),x.getMonth()-1,1)),fmtDate(new Date(x.getFullYear(),x.getMonth(),0))];
  return [fmtDate(new Date(x.getFullYear(),x.getMonth(),1)),fmtDate(new Date(x.getFullYear(),x.getMonth()+1,0))];}
function regRange(){const R=S.settings.reg;if(R.preset!=='custom'||!R.from||!R.to){const [a,b]=presetRange(R.preset);return [a,b];}return R.from<=R.to?[R.from,R.to]:[R.to,R.from];}
function weekdaysIn(from,to){const out=[];const x=parseDate(from),end=parseDate(to);let g=0;while(x<=end&&g++<800){const d=x.getDay();if(d!==0&&d!==6)out.push(fmtDate(x));x.setDate(x.getDate()+1);}return out;}
function regRecords(c,from,to){const out=[];const smap=new Map(c.students.map(s=>[s.id,s]));
  for(const d of Object.keys(c.attendance)){if(d<from||d>to)continue;for(const [sid,a] of Object.entries(c.attendance[d])){const s=smap.get(sid);if(s&&TYPE_LABEL[a.type])out.push({d,s,a});}}
  return out.sort((x,y)=>x.d.localeCompare(y.d)||x.s.num-y.s.num||x.s.name.localeCompare(y.s.name,'ko'));}
function regStudents(c,from,to){const withRec=new Set(regRecords(c,from,to).map(o=>o.s.id));return c.students.filter(s=>!s.left||s.left>from||withRec.has(s.id)).sort(byNum);}
function todoCount(c=C()){let n=0;for(const d of Object.values(c.attendance))for(const a of Object.values(d))if(!a.neis)n++;return n;}
function rangeLabel(a,b){return a===b?dateLabel(a):`${dateLabel(a)} ~ ${dateLabel(b)}`;}

  ['구분','번호','이름','내용','자세히'].forEach((t,i)=>sh.set(1,i,t,H));Object.assign(sh.cols,{0:26,1:6,2:12,3:24,4:60});
  const CS=ST.style({border:'all',h:'center',v:'center'}),LS=ST.style({border:'all',h:'left',v:'center',wrap:true});
  const LV=lv=>ST.style({border:'all',h:'left',v:'center',font:{b:true,color:lv==='bad'?'#B42A20':lv==='warn'?'#5C4A16':'#444444'}});
  let r=2;for(const [k,title,note] of CHK_GROUPS)for(const it of D.G[k]){sh.set(r,0,`${title} (${note(D)})`,LS);sh.set(r,1,it.s.num,CS);sh.set(r,2,it.s.name,CS);sh.set(r,3,it.main,LV(it.lv));sh.set(r,4,it.sub,LS);r++;}
  for(const it of D.rec){sh.set(r,0,'기록 정리 (이 기간)',LS);sh.set(r,1,'',CS);sh.set(r,2,'',CS);sh.set(r,3,it.main,LV(it.lv));sh.set(r,4,it.sub,LS);r++;}
  if(r===2)sh.set(2,0,'확인할 것이 없어요',null);
  sh.set(r+1,0,`기준: 수업일수 ${D.RL.schoolDays}일(결석 ${D.allowed}일까지) · 미인정 지각·조퇴·결과 ${D.RL.unexConv}회 = 결석 1일, ${D.RL.unexStep}일 단계 · 체험학습 연 ${D.RL.tripMax}일 · 학생선수 출석인정 연 ${D.RL.athleteMax}일 · 생리통 한 달 1번`,null);
  return sh;
}
function docsSheet(c,ST,from,to,todoOnly){
  const sh=newSheet('증빙서류');const H=ST.style({font:{b:true},fill:HEADF,border:'all',h:'center'});
  titleRow(sh,ST,`${c.name} 증빙서류 점검 · ${rangeLabel(from,to)}`+(todoOnly?' · 아직 안 받은 것만':''));
  ['번호','이름','나이스 마감','기간','일수','필요한 서류','받은 서류','상태','제출 기한'].forEach((t,i)=>sh.set(1,i,t,H));Object.assign(sh.cols,{0:6,1:12,2:18,3:24,4:6,5:46,6:30,7:16,8:14});
  let eps=episodes(c).filter(ep=>ep.start<=to&&ep.end>=from&&ep.items.length&&!ep.fix).sort((a,b)=>a.s.num-b.s.num||a.start.localeCompare(b.start));if(todoOnly)eps=eps.filter(ep=>!epDone(ep));
  const CS=ST.style({border:'all',h:'center',v:'center'}),LS=ST.style({border:'all',h:'left',v:'center',wrap:true});
  eps.forEach((ep,i)=>{const r=i+2;const done=epDone(ep);const got=done?ep.items:ep.items.filter(it=>epGot(ep,it));const over=!done&&ep.due&&daysUntil(ep.due)<0;
    [ep.s.num,ep.s.name+(ep.s.left?' (전출)':''),neisLabel({type:ep.type,reason:ep.reason})+(ep.kind?` (${ep.kind})`:''),ep.start===ep.end?ep.start:`${ep.start} ~ ${ep.end}`,ep.days.length].forEach((v,k)=>sh.set(r,k,v,CS));
    sh.set(r,5,ep.items.join('\n'),LS);sh.set(r,6,got.join('\n'),LS);sh.set(r,7,done?'받음':over?'미제출 (기한 지남)':'미제출',ST.style({border:'all',h:'center',v:'center',font:{b:true,color:done?'#2F8466':over?'#B42A20':'#5C4A16'}}));sh.set(r,8,ep.due||'',CS);});
  if(!eps.length)sh.set(2,0,'이 기간에는 증빙서류가 필요한 기록이 없어요',null);
  return sh;
}
const REG_TAB_NAME={date:'날짜별',student:'학생별',grid:'출석부 표',docs:'증빙서류'};
async function exportRegXlsx(kind){
  const c=C();const [from,to]=regRange();const R=S.settings.reg;kind=kind||R.tab;
  const idx=episodeIndex(c);const notes=[];let pred=null;
  if(kind==='date'||kind==='student'){const preds=[];if(R.todo){preds.push(o=>!o.a.neis);notes.push('나이스에 아직 안 옮긴 것만');}
    if(R.docTodo){preds.push(o=>{const ep=idx.get(o.s.id+'|'+o.d);return epNeedsDocs(ep)&&!epDone(ep);});notes.push('증빙서류 안 받은 것만');}
    if(preds.length)pred=o=>preds.every(f=>f(o));}
  try{const ST=makeStyles();let sheets,label;
    if(kind==='date'){sheets=[{sheet:recSheet(c,ST,from,to,'날짜별',false,pred,notes.join(', ')),opt:{freezeRow:2,fitWidth:true}}];label='날짜별';}
    else if(kind==='student'){sheets=[{sheet:recSheet(c,ST,from,to,'학생별',true,pred,notes.join(', ')),opt:{freezeRow:2,fitWidth:true}}];label='학생별';}
    else if(kind==='grid'){sheets=[{sheet:gridSheet(c,ST,from,to),opt:{freezeRow:3,freezeCol:2,fitWidth:true,landscape:true,noGrid:true}},{sheet:totalsSheet(c,ST,from,to,'누계'),opt:{freezeRow:3,fitWidth:true,landscape:true}},{sheet:checksSheet(c,ST,from,to),opt:{freezeRow:2,fitWidth:true,landscape:true}}];label='출석부표';}
    else if(kind==='docs'){sheets=[{sheet:docsSheet(c,ST,from,to,!!R.todo),opt:{freezeRow:2,fitWidth:true,landscape:true}}];label='증빙서류';}
    else{sheets=[{sheet:recSheet(c,ST,from,to,'날짜별',false),opt:{freezeRow:2,fitWidth:true}},{sheet:recSheet(c,ST,from,to,'학생별',true),opt:{freezeRow:2,fitWidth:true}},
      {sheet:gridSheet(c,ST,from,to),opt:{freezeRow:3,freezeCol:2,fitWidth:true,landscape:true,noGrid:true}},{sheet:totalsSheet(c,ST,from,to,'누계'),opt:{freezeRow:3,fitWidth:true,landscape:true}},{sheet:docsSheet(c,ST,from,to,false),opt:{freezeRow:2,fitWidth:true,landscape:true}},{sheet:checksSheet(c,ST,from,to),opt:{freezeRow:2,fitWidth:true,landscape:true}}];label='전체';}
    const blob=await buildXlsx(sheets,ST);
    await saveFile(`${safeName(c.name)}_출석부_${label}_${from}~${to}.xlsx`,blob);
  }catch(e){toast(e.message==='NOZIP'?'엑셀 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요':'엑셀 파일을 만들지 못했어요');console.error(e);}
}
function listSheet(c,ST){
  const sh=newSheet('학생 명단');const H=ST.style({font:{b:true},fill:'#E3ECE7',border:'all',h:'center'}),N=ST.style({border:'all',h:'center'});
  ['번호','이름','자리'].forEach((t,i)=>sh.set(0,i,t,H));Object.assign(sh.cols,{0:6,1:14,2:12});
  const seated=seatedSet();activeStudents(c).sort(byNum).forEach((s,i)=>{sh.set(i+1,0,s.num,N);sh.set(i+1,1,s.name,N);sh.set(i+1,2,seated.has(s.id)?'앉음':'자리 없음',N);});
  return sh;
}
async function exportXlsx(){
  const c=C();try{const ST=makeStyles();
    const blob=await buildXlsx([{sheet:seatSheet(c,ST),opt:{fit:true,noGrid:true}},{sheet:recSheet(c,ST,'0000-00-00','9999-12-31','출결 기록',false),opt:{freezeRow:2,fitWidth:true}},{sheet:monthSheet(c,ST),opt:{freezeRow:3,fitWidth:true,landscape:true}},{sheet:listSheet(c,ST),opt:{freezeRow:1,fitWidth:true}}],ST);

}

/* ---------- print (file version) ---------- */
function preparePrint(){const P=S.settings.print;document.body.classList.toggle('print-no-att',!P.att);document.body.classList.toggle('with-side',!!P.side);printing=true;renderPrintBits();renderBoard();}
function doPrint(){preparePrint();setTimeout(()=>{window.print();},60);}
window.addEventListener('beforeprint',()=>{if(!printing&&view==='board')preparePrint();});
window.addEventListener('afterprint',()=>{printing=false;document.body.classList.remove('print-no-att','with-side');renderBoard();});
function openPrint(){
  const P=S.settings.print;
  const att=h('input',{type:'checkbox',id:'pAtt',checked:!!P.att});
  const side=h('input',{type:'checkbox',id:'pSideChk',checked:!!P.side});
